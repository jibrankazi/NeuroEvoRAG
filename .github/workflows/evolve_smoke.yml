name: Offline retrieval optimization tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  offline-retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy scikit-learn pytest
      - run: python -m pytest -q tests/test_offline_retrieval.py
      - run: python -m benchmarks.offline_retrieval
