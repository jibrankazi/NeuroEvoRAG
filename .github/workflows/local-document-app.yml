name: Local document QA application regression and browser screenshot
on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - "requirements-service.txt"
      - "Dockerfile"
      - "tests/test_service_api.py"
      - ".github/workflows/local-document-app.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-http-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated service runtime and API fixture tests
        run: |
          python -m pip install -r requirements-service.txt
          python -m pip install pytest
      - name: Exercise upload, ask, exact-source citations, scope isolation and invalid inputs
        run: python -m pytest -q tests/test_service_api.py
      - name: Start actual local FastAPI server for HTTP smoke
        run: |
          nohup python -m uvicorn service.api:app --host 127.0.0.1 --port 8000 > /tmp/neuro-api.log 2>&1 &
          python - <<'PY'
          import time, requests
          for i in range(80):
              try:
                  resp = requests.get("http://127.0.0.1:8000/health", timeout=2)
                  if resp.status_code == 200:
                      assert resp.json()["local_only"]
                      break
              except requests.RequestException:
                  time.sleep(.25)
          else:
              raise SystemExit("Local HTTP server did not become healthy")
          html = requests.get("http://127.0.0.1:8000/", timeout=5)
          assert html.status_code == 200 and "NeuroEvoRAG" in html.text
          print("Actual HTTP health and homepage healthy")
          PY
      - name: Real published SQuAD passage upload to actual HTTP API and pretrained reader inference
        run: |
          python - <<'PY'
          import requests
          from benchmarks.real_squad_qa import download_actual_dataset
          base="http://127.0.0.1:8000"
          originals, source_sha = download_actual_dataset()
          example = originals[0]
          qa = example["qa"][0]
          workspace = requests.post(base+"/api/workspaces", timeout=15)
          workspace.raise_for_status()
          token = workspace.json()["workspace_id"]
          headers={"X-Workspace-ID":token}
          submitted=requests.post(base+"/api/documents",
              files={"file":("original_squad_source.txt", example["context"].encode("utf-8"), "text/plain")},
              headers=headers, timeout=20)
          submitted.raise_for_status()
          scored=requests.post(base+"/api/ask",
              json={"question":qa["question"],"top_k":3},
              headers=headers,timeout=300)
          scored.raise_for_status()
          out=scored.json()
          assert not out["abstained"],out
          cite=out["citations"][0]
          assert cite["filename"]=="original_squad_source.txt"
          assert example["context"][cite["start_char"]:cite["end_char"]]==out["answer"]
          assert out["answer"]==cite["quoted_span"]
          assert out["extractive_not_generative"]
          print("REAL API FULL LIFECYCLE",{"source_sha256":source_sha,
              "published_squad_question":qa["question"],
              "real_pretrained_model_answer":out["answer"],
              "published_reference_answers":qa["gold_answers"],
              "span_verified":True})
          PY
      - name: Capture actual served interface screenshot (not a generated mockup)
        run: |
          mkdir -p docs/screenshots
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless=new --no-sandbox --disable-dev-shm-usage               --hide-scrollbars --window-size=1440,1050               --screenshot="$PWD/docs/screenshots/neuroevo-local-ui.png"               http://127.0.0.1:8000/ || true
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/screenshots/neuroevo-local-ui.png")
          if p.is_file():
              assert p.read_bytes()[:8] == bytes.fromhex("89504e470d0a1a0a")
              print("Actual served browser screenshot:", p.stat().st_size)
          else:
              print("System Chrome unavailable; browser screenshot not captured")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: local-document-api-working-ui-screenshot
          path: |
            docs/screenshots/
            /tmp/neuro-api.log
          if-no-files-found: warn
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible local container
        run: docker build -t neuroevo-local:ci .
      - name: Container starts with HTTP health (no external model inference assertion)
        run: |
          docker run --detach --rm --name neuroevo-smoke             -p 127.0.0.1:8001:8000 neuroevo-local:ci
          trap 'docker rm -f neuroevo-smoke || true' EXIT
          python - <<'PY'
          import time, urllib.request, json
          for i in range(100):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=3) as f:
                      data=json.load(f)
                  assert data["status"]=="ok"
                  print("Real Docker image is running:",data)
                  break
              except Exception:
                  time.sleep(.3)
          else:
              raise RuntimeError("Container failed to serve health endpoint")
          PY
